<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d47a1, #1565c0); /* Mild dark blue gradient */
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        .navbar {
            background-color: #0d47a1; /* Dark blue color for navbar */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: bold;
            color: #fff;
        }

        .container {
            margin-top: 50px;
        }

        .video-feed {
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .attendance-list {
            background: #1a237e; /* Darker blue for contrast */
            color: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-height: 500px;
            overflow-y: auto;
        }

        .attendance-list h4 {
            font-weight: bold;
            margin-bottom: 15px;
        }

        .list-group-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: none;
            border-bottom: 1px solid #3949ab; /* Subtle border */
            background: transparent;
            color: #fff;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        /* Background Animation */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-animation .shape {
            position: absolute;
            animation: float 10s infinite ease-in-out;
        }

        .background-animation .shape.circle {
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 10%;
            left: 20%;
            animation-duration: 12s;
        }

        .background-animation .shape.square {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            top: 50%;
            left: 70%;
            animation-duration: 15s;
        }

        .background-animation .shape.triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid rgba(255, 255, 255, 0.1);
            top: 70%;
            left: 30%;
            animation-duration: 18s;
        }

        .background-animation .shape.hexagon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            top: 20%;
            left: 80%;
            animation-duration: 16s;
        }

        .background-animation .shape.ellipse {
            width: 200px;
            height: 100px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            top: 40%;
            left: 10%;
            animation-duration: 14s;
        }

        .background-animation .shape.star {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid rgba(255, 255, 255, 0.1);
            position: relative;
            top: 60%;
            left: 50%;
            animation-duration: 20s;
        }

        .background-animation .shape.star:before {
            content: '';
            position: absolute;
            top: 18px;
            left: -30px;
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-top: 60px solid rgba(255, 255, 255, 0.1);
        }

        .background-animation .shape.large-oval {
            width: 400px;
            height: 200px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            top: 20%;
            left: 40%;
            animation-duration: 25s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(20px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }
    </style>
    <script>
        function fetchAttendance() {
            fetch('/get_attendance')
                .then(response => response.json())
                .then(data => {
                    const attendanceList = document.getElementById('attendance-list');
                    attendanceList.innerHTML = '<h4>Attendance List</h4><ul class="list-group">' + data.map(record => `
                        <li class="list-group-item">
                            <span>${record.Name} (${record.ID})</span>
                            <span>${record.Time}</span>
                        </li>`).join('') + '</ul>';
                });
        }

        setInterval(fetchAttendance, 5000); // Fetch attendance every 5 seconds
    </script>
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="shape circle"></div>
        <div class="shape square"></div>
        <div class="shape triangle"></div>
        <div class="shape hexagon"></div>
        <div class="shape ellipse"></div>
        <div class="shape star"></div>
        <div class="shape large-oval"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-home"></i> Attendance System
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h2 class="text-center mb-4">Take Attendance</h2>
        <form method="POST" class="mb-5">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="teacher_name" class="form-label">Teacher Name</label>
                    <input type="text" class="form-control" id="teacher_name" name="teacher_name" value="{{ teacher_name }}" readonly>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="class_name" class="form-label">Class</label>
                    <input type="text" class="form-control" id="class_name" name="class_name" required>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary w-100">Start Attendance</button>
                <a href="{{ url_for('take_attendance') }}" class="btn btn-secondary w-100">Restart</a>
            </div>
        </form>

        {% if teacher_name and class_name %}
        <div class="row">
            <!-- Video Feed Section -->
            <div class="col-md-8">
                <img src="{{ url_for('video_feed') }}" class="img-fluid video-feed">
            </div>
            <!-- Attendance List Section -->
            <div class="col-md-4">
                <div id="attendance-list" class="attendance-list">
                    <h4>Attendance List</h4>
                    <ul class="list-group">
                        {% for data in attendance_data %}
                            <li class="list-group-item">
                                <span>{{ data.Name }} ({{ data.ID }})</span>
                                <span>{{ data.Time }}</span>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
        <button onclick="location.href='/save_attendance'" class="btn btn-success mt-3 w-100">Save Attendance</button>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
