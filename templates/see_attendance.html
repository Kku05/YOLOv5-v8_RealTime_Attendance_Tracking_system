<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #004d40, #00796b);
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        .navbar {
            background-color: #004d40;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: bold;
            color: #fff;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: #004d40;
        }

        .card-header {
            background: #00796b;
            color: #fff;
            border-radius: 15px 15px 0 0;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #00796b;
            border: none;
        }

        .btn-primary:hover {
            background-color: #004d40;
        }

        .list-group-item {
            border: none;
            border-bottom: 1px solid #ddd;
        }

        .list-group-item:last-child {
            border-bottom: none;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-animation .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            animation: float 10s infinite ease-in-out;
        }

        .background-animation .shape.circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            top: 10%;
            left: 20%;
            animation-duration: 12s;
        }

        .background-animation .shape.square {
            width: 100px;
            height: 100px;
            top: 50%;
            left: 70%;
            animation-duration: 15s;
        }

        .background-animation .shape.triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid rgba(255, 255, 255, 0.1);
            top: 70%;
            left: 30%;
            animation-duration: 18s;
        }

        .background-animation .shape.ellipse {
            width: 200px;
            height: 100px;
            border-radius: 50%;
            top: 40%;
            left: 10%;
            background: rgba(255, 255, 255, 0.15);
            animation-duration: 14s;
        }

        .background-animation .shape.hexagon {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            top: 20%;
            left: 80%;
            animation-duration: 16s;
        }

        .background-animation .shape.star {
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-bottom: 60px solid rgba(255, 255, 255, 0.1);
            position: relative;
            top: 60%;
            left: 50%;
            animation-duration: 20s;
        }

        .background-animation .shape.star:before {
            content: '';
            position: absolute;
            top: 18px;
            left: -30px;
            width: 0;
            height: 0;
            border-left: 30px solid transparent;
            border-right: 30px solid transparent;
            border-top: 60px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(20px);
            }
            100% {
                transform: translateY(0) translateX(0);
            }
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <div class="background-animation">
        <div class="shape circle"></div>
        <div class="shape square"></div>
        <div class="shape triangle"></div>
        <div class="shape ellipse"></div>
        <div class="shape hexagon"></div>
        <div class="shape star"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-home"></i> Attendance System
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h2 class="text-center mb-4">See Attendance</h2>

        <!-- Form Section -->
        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-search icon"></i> Search Attendance
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="teacher_name" class="form-label">Teacher Name</label>
                            <input type="text" class="form-control" id="teacher_name" name="teacher_name" value="{{ session['username'] }}" readonly>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="class_name" class="form-label">Class</label>
                            <input type="text" class="form-control" id="class_name" name="class_name" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">See Attendance</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('see_attendance') }}" class="btn btn-secondary w-100">Restart</a>
                </div>
            </div>
        </div>

        <!-- Available CSV Files -->
        {% if csv_files %}
        <h2>Select a CSV File</h2>
        <form method="POST" action="{{ url_for('view_attendance') }}">
            <input type="hidden" name="teacher_name" value="{{ session['username'] }}">
            <input type="hidden" name="class_name" value="{{ class_name }}">
            <input type="hidden" name="date" value="{{ date }}">
            <select name="csv_file" class="form-select mb-3">
                {% for file in csv_files %}
                    <option value="{{ file }}">{{ file }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-success">View Attendance</button>
        </form>
        {% endif %}

        <!-- Attendance Records -->
        {% if attendance_records %}
        <div class="card mb-4 mt-4">
            <div class="card-header">
                <i class="fas fa-list icon"></i> Attendance Records
            </div>
            <div class="card-body">
                <ul class="list-group">
                    {% for record in attendance_records %}
                        <li class="list-group-item">
                            <strong>{{ record.Name }}</strong> ({{ record.ID }}) - {{ record.Time }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
