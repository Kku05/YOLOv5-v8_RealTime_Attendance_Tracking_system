<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Real-Time Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
            color: #fff;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.96);
            color: #212529;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 820px;
            width: 92%;
            overflow: hidden;
        }

        .btn-primary {
            background-color: #1b263b;
            border: none;
            font-weight: 600;
            padding: 10px 20px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #0d1b2a;
            transform: translateY(-1px);
        }

        .form-control {
            border: 1.5px solid #ced4da;
            border-radius: 8px;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: #415a77;
            box-shadow: 0 0 0 0.2rem rgba(65, 90, 119, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-card p-4 p-md-5">
        <div class="row align-items-center g-4">
            <div class="col-md-5 text-center d-none d-md-block">
                <img src="/static/login.png" alt="Login Graphic" class="img-fluid rounded-3 mb-2" onerror="this.src='/static/home.png'">
                <h5 class="fw-bold text-dark mt-2 mb-1">Face Recognition AI</h5>
                <p class="text-muted small mb-0">Automated Attendance & Liveness Tracking</p>
            </div>
            
            <div class="col-md-7">
                <div class="text-center text-md-start mb-4">
                    <h2 class="fw-bold text-dark mb-1"><i class="fas fa-shield-alt text-primary me-2"></i>Instructor Login</h2>
                    <p class="text-muted small">Sign in to manage classes and start attendance sessions.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger py-2 small d-flex align-items-center" role="alert">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form method="POST" action="{{ url_for('login_user') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. tirth or admin" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="user_id" class="form-label fw-semibold small text-secondary">Password / Security ID</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="user_id" name="user_id" placeholder="Enter your password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-6 shadow-sm">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
